<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мои финансы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F4EE; --ink:#1E2A28; --line:#D9D4C6;
  --moss:#4B6A5A; --moss-soft:#E4EAE3;
  --brick:#9A4B3E; --brick-soft:#F2E2DD;
  --muted:#7A7566;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#171A18; --ink:#EDEAE0; --line:#33372F;
    --moss:#8FB79E; --moss-soft:#233028;
    --brick:#D98E7E; --brick-soft:#3A2622;
    --muted:#8A8778;
  }
}
:root[data-theme="dark"]{
  --paper:#171A18; --ink:#EDEAE0; --line:#33372F;
  --moss:#8FB79E; --moss-soft:#233028;
  --brick:#D98E7E; --brick-soft:#3A2622;
  --muted:#8A8778;
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;
  min-height:100%;padding:28px 16px 60px;}
.wrap{max-width:640px;margin:0 auto;}
h1{font-family:'Fraunces',serif;font-weight:600;font-size:1.9rem;margin:0 0 4px;letter-spacing:-.01em;}
.sub{color:var(--muted);font-size:.92rem;margin:0 0 20px;}
.summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:20px;}
.tile{border:1px solid var(--line);border-radius:10px;padding:12px 10px;text-align:left;}
.tile .lbl{font-size:.72rem;color:var(--muted);margin-bottom:4px;}
.tile .val{font-family:'Fraunces',serif;font-size:1.3rem;font-variant-numeric:tabular-nums;}
.balance{grid-column:1/-1;background:var(--moss-soft);border:1px solid var(--line);border-radius:10px;
  padding:14px 16px;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
.balance .val{font-family:'Fraunces',serif;font-size:1.7rem;font-variant-numeric:tabular-nums;}
.tabs{display:flex;gap:6px;margin-bottom:22px;border-bottom:1px solid var(--line);}
.tabs button{flex:1;background:none;border:none;padding:10px 4px;font-family:inherit;font-size:.95rem;
  color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
.tabs button.active{color:var(--ink);font-weight:600;border-bottom-color:var(--ink);}
.panel{display:none;}
.panel.active{display:block;}
section{margin-bottom:26px;}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;
  border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:10px;}
.sec-head h2{font-size:1.02rem;font-weight:600;margin:0;}
.sec-head .total{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem;}
.cat{border-bottom:1px solid var(--line);}
.cat:last-of-type{border-bottom:none;}
.cat-head{display:flex;align-items:center;gap:8px;padding:9px 0;cursor:pointer;}
.cat-head .chev{color:var(--muted);font-size:.75rem;width:12px;transition:transform .15s;}
.cat-head.open .chev{transform:rotate(90deg);}
.cat-head .name{flex:1;}
.cat-head .total{width:110px;text-align:right;font-variant-numeric:tabular-nums;}
.cat-head .trash{border:none;background:none;color:var(--muted);cursor:pointer;font-size:.95rem;padding:2px 4px;}
.cat-head .trash:hover{color:var(--brick);}
.entries{display:none;padding:0 0 8px 20px;}
.entries.open{display:block;}
.entry{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:.88rem;color:var(--muted);}
.entry .d{width:60px;}
.entry .a{width:90px;text-align:right;outline:none;border-radius:5px;padding:1px 4px;font-variant-numeric:tabular-nums;color:var(--ink);}
.entry .a:focus{background:var(--line);}
.entry .x{border:none;background:none;color:var(--muted);cursor:pointer;font-size:.9rem;}
.entry .x:hover{color:var(--brick);}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
.row:last-of-type{border-bottom:none;}
.row .name{flex:1;outline:none;padding:2px 4px;border-radius:5px;}
.row .name:focus{background:var(--line);}
.row .amt{width:110px;text-align:right;font-variant-numeric:tabular-nums;outline:none;padding:2px 4px;border-radius:5px;}
.row .amt:focus{background:var(--line);}
.row .del{border:none;background:none;color:var(--muted);cursor:pointer;font-size:1rem;padding:2px 6px;line-height:1;}
.row .del:hover{color:var(--brick);}
.empty{color:var(--muted);font-size:.88rem;padding:8px 0;}
.add{display:flex;gap:8px;margin-top:10px;}
.add input{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:7px;
  padding:8px 10px;font-family:inherit;font-size:.92rem;}
.add input[name="n"]{flex:1;}
.add input[name="a"]{width:110px;font-variant-numeric:tabular-nums;}
.add button{border:none;border-radius:7px;padding:8px 14px;font-size:.9rem;cursor:pointer;
  background:var(--ink);color:var(--paper);font-weight:500;}
.income .sec-head .total, .income .cat-head .total{color:var(--moss);}
.expense .sec-head .total, .expense .cat-head .total{color:var(--brick);}
.debt .sec-head .total{color:var(--brick);}
.periods{display:flex;gap:8px;margin-bottom:18px;}
.periods button{flex:1;border:1px solid var(--line);background:transparent;color:var(--ink);
  border-radius:7px;padding:8px;font-family:inherit;font-size:.88rem;cursor:pointer;}
.periods button.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.rep-totals{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:24px;}
.rep-cat{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:.92rem;}
.rep-cat:last-of-type{border-bottom:none;}
.rep-cat .n{color:var(--ink);}
.rep-cat .a{font-variant-numeric:tabular-nums;color:var(--muted);}
.debt-note{font-size:.82rem;color:var(--muted);margin-top:4px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Мои финансы</h1>
  <p class="sub">Доход, расходы и долги — хранится только на этом телефоне.</p>

  <div class="summary">
    <div class="balance"><span class="lbl">Баланс</span><span class="val" id="balanceVal">0</span></div>
    <div class="tile"><div class="lbl">Доход</div><div class="val" id="incTotal">0</div></div>
    <div class="tile"><div class="lbl">Расход</div><div class="val" id="expTotal">0</div></div>
    <div class="tile"><div class="lbl">Долги</div><div class="val" id="debtTotal">0</div></div>
  </div>

  <div class="tabs">
    <button class="active" data-tab="entries">Записи</button>
    <button data-tab="report">Итоги</button>
  </div>

  <div class="panel active" id="panel-entries">
    <section class="income" data-type="income">
      <div class="sec-head"><h2>Доход</h2><span class="total"></span></div>
      <div class="cats"></div>
      <form class="add" onsubmit="return addItem(event,'income')">
        <input name="n" placeholder="Источник (зарплата, подработка…)" required>
        <input name="a" type="number" step="any" placeholder="Сумма" required>
        <button type="submit">+</button>
      </form>
    </section>

    <section class="expense" data-type="expenses">
      <div class="sec-head"><h2>Расход</h2><span class="total"></span></div>
      <div class="cats"></div>
      <form class="add" onsubmit="return addItem(event,'expenses')">
        <input name="n" placeholder="Статья (еда, бензин…)" required>
        <input name="a" type="number" step="any" placeholder="Сумма" required>
        <button type="submit">+</button>
      </form>
    </section>

    <section class="debt">
      <div class="sec-head"><h2>Долги</h2><span class="total"></span></div>
      <div class="rows"></div>
      <form class="add" onsubmit="return addDebt(event)">
        <input name="n" placeholder="Кому/кто (или за что)" required>
        <input name="a" type="number" step="any" placeholder="Сумма" required>
        <button type="submit">+</button>
      </form>
    </section>
  </div>

  <div class="panel" id="panel-report">
    <div class="periods">
      <button data-period="week" class="active">Неделя</button>
      <button data-period="month">Месяц</button>
      <button data-period="all">Всё время</button>
    </div>
    <div class="rep-totals">
      <div class="tile"><div class="lbl">Доход</div><div class="val" id="repInc">0</div></div>
      <div class="tile"><div class="lbl">Расход</div><div class="val" id="repExp">0</div></div>
      <div class="tile"><div class="lbl">Баланс</div><div class="val" id="repBal">0</div></div>
    </div>
    <section>
      <div class="sec-head"><h2>Доход по статьям</h2></div>
      <div id="repIncList"></div>
    </section>
    <section>
      <div class="sec-head"><h2>Расход по статьям</h2></div>
      <div id="repExpList"></div>
    </section>
    <p class="debt-note">Долги (текущий остаток, не зависит от периода): <span id="repDebt">0</span></p>
  </div>
</div>

<script>
const KEY='finance-tracker-v2';
let state={tx:[],debts:[]};
try{
  const raw=localStorage.getItem(KEY);
  if(raw){ state=JSON.parse(raw); }
  else{
    const old=localStorage.getItem('finance-tracker-v1');
    if(old){
      const o=JSON.parse(old);
      const today=todayISO();
      state.tx=[...(o.income||[]).map(x=>({id:rid(),type:'income',n:x.n,a:x.a,date:today})),
                ...(o.expenses||[]).map(x=>({id:rid(),type:'expenses',n:x.n,a:x.a,date:today}))];
      state.debts=o.debts||[];
      save();
    }
  }
}catch(e){}

function rid(){ return Date.now()+'-'+Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function fmt(n){ return (Math.round(n*100)/100).toLocaleString('ru-RU'); }
function fmtDate(d){ const p=d.split('-'); return p[2]+'.'+p[1]; }
function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function groupCats(type, from){
  const map={};
  state.tx.filter(t=>t.type===type && (!from || t.date>=from)).forEach(t=>{
    const key=t.n.trim().toLowerCase();
    if(!map[key]) map[key]={key,name:t.n.trim(),total:0,entries:[]};
    map[key].total+=t.a; map[key].entries.push(t);
  });
  return Object.values(map).sort((a,b)=>b.total-a.total);
}

function renderEntries(){
  document.querySelectorAll('#panel-entries section.income, #panel-entries section.expense').forEach(sec=>{
    const type=sec.dataset.type;
    const cats=groupCats(type,null);
    const wrap=sec.querySelector('.cats');
    wrap.innerHTML='';
    if(!cats.length){ wrap.innerHTML='<div class="empty">Пока пусто</div>'; }
    cats.forEach(cat=>{
      const catEl=document.createElement('div'); catEl.className='cat';
      const head=document.createElement('div'); head.className='cat-head';
      head.innerHTML=`<span class="chev">▸</span><span class="name">${escapeHtml(cat.name)}</span>
        <span class="total">${fmt(cat.total)}</span>
        <button class="trash" title="Удалить статью целиком">✕</button>`;
      const entriesEl=document.createElement('div'); entriesEl.className='entries';
      cat.entries.slice().sort((a,b)=>b.date.localeCompare(a.date)).forEach(t=>{
        const row=document.createElement('div'); row.className='entry';
        row.innerHTML=`<span class="d">${fmtDate(t.date)}</span><span class="a" contenteditable="true">${t.a}</span><button class="x">✕</button>`;
        row.querySelector('.a').addEventListener('blur',e=>{
          const v=parseFloat(e.target.textContent.replace(',','.'));
          t.a=isNaN(v)?t.a:v; e.target.textContent=t.a; save(); renderEntries();
        });
        row.querySelector('.x').addEventListener('click',()=>{
          state.tx=state.tx.filter(x=>x.id!==t.id); save(); renderEntries();
        });
        entriesEl.appendChild(row);
      });
      head.addEventListener('click',e=>{
        if(e.target.classList.contains('trash')) return;
        head.classList.toggle('open'); entriesEl.classList.toggle('open');
      });
      head.querySelector('.trash').addEventListener('click',()=>{
        state.tx=state.tx.filter(t=>t.n.trim().toLowerCase()!==cat.key); save(); renderEntries();
      });
      catEl.appendChild(head); catEl.appendChild(entriesEl);
      wrap.appendChild(catEl);
    });
  });
  renderDebts();
  updateSummary();
}

function renderDebts(){
  const rowsEl=document.querySelector('.debt .rows');
  rowsEl.innerHTML='';
  if(!state.debts.length){ rowsEl.innerHTML='<div class="empty">Пока пусто</div>'; }
  state.debts.forEach((item,i)=>{
    const row=document.createElement('div'); row.className='row';
    row.innerHTML=`<span class="name" contenteditable="true">${escapeHtml(item.n)}</span>
      <span class="amt" contenteditable="true">${item.a}</span><button class="del">✕</button>`;
    row.querySelector('.name').addEventListener('blur',e=>{ item.n=e.target.textContent.trim()||item.n; save(); });
    row.querySelector('.amt').addEventListener('blur',e=>{
      const v=parseFloat(e.target.textContent.replace(',','.'));
      item.a=isNaN(v)?item.a:v; e.target.textContent=item.a; save(); updateSummary();
    });
    row.querySelector('.del').addEventListener('click',()=>{ state.debts.splice(i,1); save(); renderDebts(); updateSummary(); });
    rowsEl.appendChild(row);
  });
}

function updateSummary(){
  const incT=state.tx.filter(t=>t.type==='income').reduce((s,x)=>s+x.a,0);
  const expT=state.tx.filter(t=>t.type==='expenses').reduce((s,x)=>s+x.a,0);
  const debtT=state.debts.reduce((s,x)=>s+x.a,0);
  document.getElementById('incTotal').textContent=fmt(incT);
  document.getElementById('expTotal').textContent=fmt(expT);
  document.getElementById('debtTotal').textContent=fmt(debtT);
  document.getElementById('balanceVal').textContent=fmt(incT-expT);
  document.querySelector('.income .sec-head .total').textContent=fmt(incT);
  document.querySelector('.expense .sec-head .total').textContent=fmt(expT);
  document.querySelector('.debt .sec-head .total').textContent=fmt(debtT);
}

function addItem(e,type){
  e.preventDefault(); const f=e.target;
  const n=f.n.value.trim(); const a=parseFloat(f.a.value);
  if(!n||isNaN(a)) return false;
  state.tx.push({id:rid(),type,n,a,date:todayISO()});
  save(); f.n.value=''; f.a.value=''; f.n.focus();
  renderEntries(); renderReport();
  return false;
}
function addDebt(e){
  e.preventDefault(); const f=e.target;
  const n=f.n.value.trim(); const a=parseFloat(f.a.value);
  if(!n||isNaN(a)) return false;
  state.debts.push({n,a}); save();
  f.n.value=''; f.a.value=''; f.n.focus();
  renderDebts(); updateSummary();
  return false;
}

let currentPeriod='week';
function periodFrom(p){
  if(p==='all') return null;
  const now=new Date();
  if(p==='week'){ const d=new Date(now); d.setDate(d.getDate()-6); return d.toISOString().slice(0,10); }
  if(p==='month'){ return now.toISOString().slice(0,8)+'01'; }
}
function renderReport(){
  const from=periodFrom(currentPeriod);
  const incCats=groupCats('income',from);
  const expCats=groupCats('expenses',from);
  const incT=incCats.reduce((s,c)=>s+c.total,0);
  const expT=expCats.reduce((s,c)=>s+c.total,0);
  document.getElementById('repInc').textContent=fmt(incT);
  document.getElementById('repExp').textContent=fmt(expT);
  document.getElementById('repBal').textContent=fmt(incT-expT);
  document.getElementById('repDebt').textContent=fmt(state.debts.reduce((s,x)=>s+x.a,0));
  const incListEl=document.getElementById('repIncList');
  const expListEl=document.getElementById('repExpList');
  incListEl.innerHTML=incCats.length? incCats.map(c=>`<div class="rep-cat"><span class="n">${escapeHtml(c.name)}</span><span class="a">${fmt(c.total)}</span></div>`).join('') : '<div class="empty">Пока пусто</div>';
  expListEl.innerHTML=expCats.length? expCats.map(c=>`<div class="rep-cat"><span class="n">${escapeHtml(c.name)}</span><span class="a">${fmt(c.total)}</span></div>`).join('') : '<div class="empty">Пока пусто</div>';
}

document.querySelectorAll('.tabs button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
    if(btn.dataset.tab==='report') renderReport();
  });
});
document.querySelectorAll('.periods button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.periods button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentPeriod=btn.dataset.period;
    renderReport();
  });
});

renderEntries();
</script>
</body>
</html>
